<div class="gauge" data-score="{{ stress_score|stringformat:'.1f' }}">
  <svg viewBox="0 0 200 115" class="gauge-svg" role="img"
       aria-label="Stress gauge showing {{ stress_score }} out of 100">
    <path d="M 20 100 A 80 80 0 0 1 60 30.7"  class="arc arc-normal"/>
    <path d="M 60 30.7 A 80 80 0 0 1 100 20" class="arc arc-mild"/>
    <path d="M 100 20 A 80 80 0 0 1 140 30.7" class="arc arc-moderate"/>
    <path d="M 140 30.7 A 80 80 0 0 1 180 100" class="arc arc-high"/>
    <g id="needle" style="transform-origin: 100px 100px;">
      <line x1="100" y1="100" x2="100" y2="34" class="needle"/>
      <circle cx="100" cy="100" r="6" class="needle-hub"/>
    </g>
  </svg>
</div>
